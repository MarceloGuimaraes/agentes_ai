[project]
name = "02-api-consulta-sqlite"
version = "0.1.0"
description = "API de agente de IA que consulta uma base SQLite local com tools fixas, usando a OpenAI via HTTP puro"
readme = "README.md"
authors = [
    { name = "Marcelo Guimarães", email = "celoguimaraes@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
